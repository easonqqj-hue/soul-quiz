<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4EEE2">
<meta name="format-detection" content="telephone=no">
<title>测测你的灵魂对应哪位中国历史人物</title>
<meta name="description" content="40道生活化小问题，测出你灵魂深处的历史人物。趣味测试，仅供娱乐。">
<style>
:root{--paper:#F4EEE2;--paper2:#EAE1CF;--card:#FBF8F1;--ink:#2B2926;--ink2:#5A544B;--ink3:#8E8676;--zhu:#A63F2E;--zhu2:#C2553F;--dai:#2E4B4A;--gold:#A8895A;--line:#DCCFB8;
--serif:"Songti SC","STSong","Noto Serif CJK SC","Noto Serif SC","Source Han Serif SC","SimSun",serif;--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);background-image:radial-gradient(ellipse at 20% 0%,rgba(168,137,90,.10),transparent 60%),radial-gradient(ellipse at 100% 100%,rgba(46,75,74,.08),transparent 55%);background-attachment:fixed;-webkit-font-smoothing:antialiased;line-height:1.7}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:520px;margin:0 auto;min-height:100%;position:relative;padding:0 20px}
.screen{display:none;min-height:100vh;padding:28px 0 40px;animation:fadeUp .5s ease both}
.screen.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.serif{font-family:var(--serif)}
/* home */
.home{display:none;flex-direction:column;align-items:center;text-align:center;justify-content:center}
.home.on{display:flex}
.kicker{font-size:12px;letter-spacing:.5em;color:var(--ink3);margin:18px 0 26px;padding-left:.5em}
.seal{display:inline-flex;align-items:center;justify-content:center;background:var(--zhu);color:#F6E9DA;font-family:var(--serif);font-weight:700;border-radius:6px;box-shadow:inset 0 0 0 2px rgba(246,233,218,.35)}
.home .seal{width:64px;height:64px;font-size:20px;line-height:1.05;writing-mode:vertical-rl;letter-spacing:2px;transform:rotate(-4deg)}
.title{font-family:var(--serif);font-weight:900;font-size:40px;line-height:1.3;letter-spacing:.06em;margin:26px 0 10px}
.title em{font-style:normal;color:var(--zhu)}
.sub{font-family:var(--serif);color:var(--ink2);font-size:15px;letter-spacing:.2em}
.ornament{width:180px;height:14px;margin:22px auto}
.names{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 10px;margin:8px 0 30px;max-width:360px}
.names span{font-family:var(--serif);font-size:13px;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:2px 12px;background:rgba(251,248,241,.6)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 34px;border-radius:999px;font-family:var(--serif);font-size:17px;letter-spacing:.2em;transition:transform .15s ease,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--zhu);color:#FBF3E8;box-shadow:0 8px 22px -10px rgba(166,63,46,.75)}
.btn-ghost{border:1px solid var(--ink3);color:var(--ink)}
.btn-block{width:100%}
.meta{margin-top:18px;font-size:12px;color:var(--ink3);letter-spacing:.08em}
.resume{margin-top:12px;font-size:14px;color:var(--dai);text-decoration:underline;text-underline-offset:4px}
.mountain{position:fixed;left:0;right:0;bottom:0;height:120px;pointer-events:none;opacity:.55;z-index:-1}
/* quiz */
.qtop{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--ink3);margin-bottom:10px}
.qtop b{font-family:var(--serif);font-size:22px;color:var(--ink);font-weight:700}
.back{font-size:13px;color:var(--ink2);padding:6px 0}
.back[disabled]{opacity:.3}
.bar{height:6px;background:var(--paper2);border-radius:99px;overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--dai),var(--zhu));border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.stage{position:relative;margin-top:34px;min-height:440px}
.qcard{position:absolute;left:0;right:0;top:0;transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .38s}
.qcard.enter{transform:translateX(40px);opacity:0}
.qcard.leave{transform:translateX(-40px);opacity:0}
.qno{font-family:var(--serif);color:var(--zhu);font-size:13px;letter-spacing:.3em}
.qtext{font-family:var(--serif);font-size:23px;font-weight:700;line-height:1.5;margin:8px 0 24px;min-height:70px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:12px;font-size:15.5px;line-height:1.5;transition:border-color .2s,background .2s,transform .15s}
.opt:active{transform:scale(.985)}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);font-family:var(--serif);font-size:14px;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--zhu);background:#F7E9E1}
.opt.sel .k{background:var(--zhu);border-color:var(--zhu);color:#fff}
.tip{text-align:center;font-size:12px;color:var(--ink3);margin-top:8px}
/* loading */
.loading{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.loading.on{display:flex}
.ink{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle,var(--ink) 0%,rgba(43,41,38,.6) 40%,transparent 70%);animation:ink 1.6s ease-in-out infinite}
@keyframes ink{0%{transform:scale(.4);opacity:.2}50%{transform:scale(1);opacity:.9}100%{transform:scale(1.4);opacity:0}}
.loading p{font-family:var(--serif);margin-top:26px;letter-spacing:.3em;color:var(--ink2)}
/* result */
.hero{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px 22px 26px;text-align:center;overflow:hidden}
.hero:before{content:"";position:absolute;inset:8px;border:1px solid rgba(168,137,90,.45);border-radius:14px;pointer-events:none}
.hero .lbl{font-size:12px;letter-spacing:.4em;color:var(--ink3);padding-left:.4em}
.hero .seal{position:absolute;right:22px;top:22px;width:46px;height:46px;font-size:15px;line-height:1.05;writing-mode:vertical-rl;transform:rotate(6deg)}
.hero h1{font-family:var(--serif);font-size:58px;font-weight:900;letter-spacing:.12em;margin:14px 0 2px;padding-left:.12em}
.hero .era{font-family:var(--serif);color:var(--ink2);font-size:14px;letter-spacing:.2em}
.hero .tag{display:inline-block;margin:14px 0 18px;color:var(--zhu);font-family:var(--serif);font-size:17px;letter-spacing:.18em}
.hero .quote{font-family:var(--serif);font-size:18px;line-height:1.7;padding:14px 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.hero .match{margin-top:14px;font-size:13px;color:var(--ink3);letter-spacing:.1em}
.hero .match b{font-family:var(--serif);font-size:22px;color:var(--zhu);margin:0 2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chip{font-size:13px;padding:3px 12px;border-radius:999px;background:var(--paper2);color:var(--ink2)}
.sec{margin-top:26px}
.sec h3{font-family:var(--serif);font-size:18px;letter-spacing:.15em;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sec h3:before{content:"";width:4px;height:18px;background:var(--zhu);border-radius:2px}
.sec p{font-size:15px;color:var(--ink2)}
.radar{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.radar svg{flex:none;width:52%;height:auto}
.dimlist{flex:1;font-size:13px}
.dimlist div{display:flex;align-items:center;gap:6px;margin:5px 0}
.dimlist span{width:30px;color:var(--ink2);font-family:var(--serif)}
.dimlist em{flex:1;height:5px;background:var(--paper2);border-radius:9px;position:relative;overflow:hidden}
.dimlist em i{position:absolute;left:0;top:0;bottom:0;background:var(--dai);border-radius:9px}
.dimlist div.top em i{background:var(--zhu)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left}
.pair small{display:block;font-size:12px;color:var(--ink3)}
.pair b{font-family:var(--serif);font-size:19px}
.pair i{display:block;font-style:normal;font-size:12px;color:var(--ink2)}
.runner{font-size:14px;color:var(--ink2);background:var(--paper2);border-radius:12px;padding:10px 14px}
.actions{display:grid;gap:12px;margin-top:30px}
.actions .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions .btn{padding:0 10px;letter-spacing:.1em;font-size:16px}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gallery button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.gallery button b{display:block;font-family:var(--serif);font-size:16px}
.gallery button i{font-style:normal;font-size:11px;color:var(--ink3)}
.gallery button.me{border-color:var(--zhu);background:#F7E9E1}
.disc{margin-top:28px;font-size:12px;color:var(--ink3);text-align:center;line-height:1.8}
/* modal */
.mask{position:fixed;inset:0;background:rgba(30,28,25,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;animation:fade .25s}
.mask.on{display:flex}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:420px;max-height:92vh;overflow:auto;text-align:center}
.sheet img{width:100%;border-radius:12px;display:block;box-shadow:0 20px 50px -20px rgba(0,0,0,.6);-webkit-touch-callout:default;user-select:auto}
.sheet .hint{color:#F4EEE2;font-size:14px;margin:14px 0 6px;letter-spacing:.1em}
.sheet .ops{display:flex;gap:10px;justify-content:center;margin-top:8px}
.sheet .ops .btn{height:42px;font-size:14px;padding:0 20px;letter-spacing:.1em}
.sheet .ops .btn-ghost{border-color:#cbbfa8;color:#F4EEE2}
.card-pop{background:var(--card);border-radius:18px;padding:26px 20px;text-align:left}
.card-pop h4{font-family:var(--serif);font-size:28px;letter-spacing:.1em}
.card-pop .t{color:var(--zhu);font-family:var(--serif);margin:2px 0 10px}
.card-pop p{font-size:14px;color:var(--ink2);margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(30,28,25,.9);color:#fff;font-size:14px;padding:10px 18px;border-radius:999px;z-index:60;display:none}
@media (min-width:760px){.title{font-size:46px}.stage{min-height:420px}}
</style>
</head>
<body>
<div class="app">
  <section class="screen home on" id="home">
    <div class="seal">灵魂<br>测试</div>
    <h1 class="title">你的灵魂<br>是哪位<em>历史人物</em></h1>
    <div class="sub">四十问 · 十六位先贤 · 六维图谱</div>
    <svg class="ornament" viewBox="0 0 180 14" aria-hidden="true"><path d="M0 7h70M110 7h70" stroke="#A8895A" stroke-width="1"/><path d="M90 1l6 6-6 6-6-6z" fill="none" stroke="#A63F2E" stroke-width="1.2"/><circle cx="78" cy="7" r="1.6" fill="#A8895A"/><circle cx="102" cy="7" r="1.6" fill="#A8895A"/></svg>
    <div class="names" id="names"></div>
    <button class="btn btn-primary" id="startBtn">开 卷 测 试</button>
    <button class="resume" id="resumeBtn" style="display:none"></button>
    <button class="resume" id="lastBtn" style="display:none">查看上次的结果</button>
    <div class="meta">约 5 分钟 · 无需登录 · 趣味测试，非心理诊断</div>
  </section>

  <section class="screen" id="quiz">
    <div class="qtop"><button class="back" id="backBtn">‹ 上一题</button><span><b id="qIdx">1</b> / <span id="qTotal">40</span></span></div>
    <div class="bar"><i id="barFill" style="width:0"></i></div>
    <div class="stage" id="stage"></div>
    <div class="tip">凭第一感觉选择，没有对错之分</div>
  </section>

  <section class="screen loading" id="loading">
    <div class="ink"></div>
    <p id="loadText">正在翻阅史册…</p>
  </section>

  <section class="screen" id="result"></section>
</div>
<svg class="mountain" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true"><path d="M0 120V78q40-30 80-8t70-30 60 26 50-10 60 20 80-22v86z" fill="#2E4B4A" opacity=".10"/><path d="M0 120V96q50-22 100-4t90-16 70 12 70-6 70 10v28z" fill="#2E4B4A" opacity=".14"/></svg>
<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
var DIMS = ['M','L','W','X','Y','J'];
var DIM_NAME = {M:'谋略',L:'统御',W:'才情',X:'侠义',Y:'逍遥',J:'果敢'};
var DIM_DESC = {M:'深思熟虑、善于布局',L:'掌控方向、带领他人',W:'感受细腻、审美在线',X:'重情重义、路见不平',Y:'自在随性、不被束缚',J:'说干就干、敢打敢冲'};

var QUESTIONS = [
['周末突然空出一整天，你最可能：',[['列个清单，把攒着的事一件件清掉',{M:1,L:1}],['约上朋友说走就走，去哪儿路上再说',{X:1,J:1}],['窝在家看书、看展或听歌，享受安静',{W:2}],['关掉闹钟睡到自然醒，然后随缘',{Y:2}]]],
['朋友群里为聚餐地点吵个不停，你会：',[['直接拍板：就这家，我来订',{L:2}],['默默查好几家的评分和人均，给出最优解',{M:2}],['谁的意见被忽略了，我帮谁说句话',{X:2}],['都行，你们定好了叫我',{Y:2}]]],
['下班路上看到一片很美的晚霞，你会：',[['拍下来，配一句自己写的文案',{W:2}],['看一眼，脑子里还在过明天的安排',{L:1,J:1}],['停下来发呆，什么都不想',{Y:2}],['顺手看看天气预报，判断明天会不会下雨',{M:2}]]],
['小组合作遇到一个总在摸鱼的队友：',[['重新分工，把他的任务和截止时间写清楚',{L:2}],['私下找他聊聊，看是不是遇到了什么事',{X:1,W:1}],['自己默默做完，懒得计较',{J:1,Y:1}],['先留好沟通记录，关键时刻再摊牌',{M:2}]]],
['你买东西的习惯更接近：',[['做功课、比价格，收藏一堆攻略',{M:2}],['看到喜欢就买，心动最重要',{J:1,W:1}],['只买需要的，东西越少越自在',{Y:2}],['宁缺毋滥，要买就买最好的',{L:2}]]],
['被人当众误会时，你的第一反应：',[['当场讲清楚，该说的必须说',{J:2}],['先忍住，事后找机会四两拨千斤',{M:2}],['心里难受很久，可能会写进日记',{W:2}],['清者自清，懒得解释',{Y:2}]]],
['深夜睡不着，你多半在：',[['复盘今天，顺便规划明天',{M:1,L:1}],['写备忘录、听歌，安静地 emo 一下',{W:2}],['刷到不平事，忍不住在评论区仗义执言',{X:2}],['起来走走、吃点东西，睡不着就不睡了',{Y:2}]]],
['你理想中的工作状态是：',[['掌握全局，带一支队伍打胜仗',{L:2}],['做幕后军师，出主意的那个人',{M:2}],['自由职业，时间自己说了算',{Y:2}],['冲在一线，结果立刻看得见',{J:2}]]],
['关系不错的朋友找你借钱：',[['真朋友的话，二话不说',{X:2}],['先问清用途和还款计划',{M:1,L:1}],['量力而行，借出去就当送了',{Y:1,X:1}],['借之外，还会帮他想想怎么把问题解决',{M:1,J:1}]]],
['你最喜欢哪种天气：',[['下雨天，适合在屋里听雨',{W:2}],['大晴天，适合出门干大事',{J:2}],['薄雾笼罩的山间，像在画里',{Y:2}],['起风的阴天，有种风云变幻的感觉',{L:1,X:1}]]],
['玩狼人杀或剧本杀时，你通常是：',[['带节奏、组织发言的那个',{L:2}],['默默盘逻辑，最后一票定胜负',{M:2}],['跟着直觉走，经常莽',{J:1,X:1}],['只为了好玩，输赢无所谓',{Y:2}]]],
['朋友对你最常见的评价是：',[['靠谱',{L:1,J:1}],['聪明',{M:2}],['有趣、有才',{W:1,Y:1}],['仗义',{X:2}]]],
['遇到心动的人，你会：',[['制定周密的“攻略”，步步为营',{M:2}],['直接表白，成不成都痛快',{J:1,X:1}],['写一大堆不会发出去的话',{W:2}],['顺其自然，有缘自然会走到一起',{Y:2}]]],
['旅行时的你是：',[['行程表精确到小时的人',{M:1,L:1}],['专挑没什么人去的小地方',{Y:2}],['逛博物馆、老街、美术馆',{W:2}],['爬最高的山，玩最刺激的项目',{J:2}]]],
['团队出了大错，领导问是谁的责任：',[['我是负责人，我先扛',{L:1,X:1}],['先把问题解决，追责以后再说',{J:2}],['冷静理清经过，给出改进方案',{M:2}],['替那个出错的同事说几句好话',{X:1,W:1}]]],
['哪种夸奖最让你开心：',[['“这事儿没你真不行。”',{L:2}],['“你想得真远。”',{M:2}],['“你写的、拍的东西真好看。”',{W:2}],['“你活得好通透。”',{Y:2}]]],
['你手机相册里最多的是：',[['截图、资料、待办',{M:2}],['天空、花草和随手拍的风景',{Y:1,W:1}],['和朋友的合照、聚会',{X:2}],['运动、健身、户外记录',{J:2}]]],
['你怎么看待“规则”：',[['好的规则应该由靠谱的人来定，比如我',{L:2}],['规则是用来研究和利用的',{M:2}],['不合理的规则就该打破',{X:1,J:1}],['规则与我何干，我只想自在',{Y:2}]]],
['生气的时候你会：',[['立刻发作，来得快去得也快',{J:2}],['表面平静，心里已经写好了剧本',{M:2}],['写下来、唱出来或者哭出来',{W:2}],['出去走一圈，回来就忘了',{Y:2}]]],
['如果能拥有一种超能力，你选：',[['读心术',{M:2}],['一呼百应的号召力',{L:2}],['瞬移，想去哪儿就去哪儿',{Y:2}],['刀枪不入，保护身边的人',{X:1,J:1}]]],
['面对一个很难的挑战：',[['越难越兴奋，冲',{J:2}],['拆成小步骤，按部就班推进',{M:1,L:1}],['拉上志同道合的人一起干',{X:2}],['不值得的话，放弃也没关系',{Y:2}]]],

  y+=78;ctx.fillStyle=C.ink3;ctx.font='30px '+SERIF;ctx.textAlign='right';ctx.fillText('灵魂契合度',W/2+20,y);ctx.textAlign='left';ctx.fillStyle=C.zhu;ctx.font='bold 54px '+SERIF;ctx.fillText(pct+'%',W/2+36,y+4);ctx.textAlign='center';
  ctx.fillStyle=C.ink2;ctx.font='bold 30px '+SERIF;spaced(ctx,opt.footer||'测测你的灵魂对应哪位中国历史人物',W/2,H-104,4,'center');
  ctx.fillStyle=C.ink3;ctx.font='22px '+SERIF;spaced(ctx,'趣味测试 · 仅供娱乐 · 非心理诊断',W/2,H-68,4,'center');
  return cv;
}
